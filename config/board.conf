# dietpi-ufi001b board configuration
# Sourced by build.sh and every scripts/*.sh

BOARD=ufi001b
BOARD_NAME="UFI001B"

# ---- device tree ----
# extlinux.conf selects this DTB for lk1st/extlinux.
KERNEL_DTB=msm8916-thwc-ufi001c.dtb

# ---- bootloader (lk1st from msm8916-mainline/lk2nd) ----
# LK1ST_COMPATIBLE must match a compatible listed in the bundled device dts.
# UFI001B/C: use thwc,ufi001c - it maps the only button (GPIO 37, KEY_HOME)
# and selects msm8916-thwc-ufi001c.dtb. The yiming,uz801-v3 node has no
# gpio-keys (falls back to volume keys) and would mis-boot into fastboot.
LK1ST_COMPATIBLE=thwc,ufi001c
LK1ST_BUNDLE_DTB=msm8916-512mb-mtp.dtb

# ---- DTB patch knobs ----
# 0 = keep stock table (up to 998.4 MHz); >0 = 400/800/1000/1100/... up to this MHz.
CPU_OPP_MHZ=1200
# 1 = free the modem carve-out (~85 MiB), only when the modem partition / 4G
#     modem is not required. Does BOTH:
#       - statically: delete /reserved-memory/mpss + /memshare/mpss@0 in the
#         bundled boot DTB (patch_dtb.py --release-memory, 03-fetch-firmware.sh)
#       - at runtime: lk1st disables the modem remoteproc and deletes its
#         reserved regions via the ported lk2nd-rproc module
#         (scripts/02-build-bootloader.sh, macro LK2ND_RPROC_MODE)
# LK2ND_RPROC_MODE selects how aggressive the runtime release is:
#   no_modem - only modem (mpss): keeps adsp (calls/audio) + venus + wcnss,
#              ~59 MiB less usable RAM than "none"
#   none     - modem + adsp + venus disabled, audio re-routed to LPASS,
#              frees the full ~85 MiB reserve (matches the community
#              "release memory" build that reports ~462 MiB); WCNSS is also
#              disabled so the Wi-Fi radio has no firmware path
#   wifi     - disable modem + venus (free their carve-outs) but keep WCNSS
#              so the mainline wcn36xx Wi-Fi/BT stack can come up. Best RAM
#              vs feature trade-off for a dongle that must provide Wi-Fi.
RELEASE_MEMORY=1
LK2ND_RPROC_MODE=wifi
# 1 = also delete the leftover modem/GPS-era reservations in the DTB
#     (gps / rmtfs / rfsa / reserved@86680000, ~3.5 MiB). tz-apps, tz,
#     smem and hypervisor are always kept. Requires RELEASE_MEMORY=1 to be
#     useful: it runs after --release-memory and shares its dangling-phandle
#     cleanup. Reflecting back is trivial (live source, flip the flag or
#     rebuild without it / restore the patch input DTB).
AGGRESSIVE_MEMORY=1

# ---- server profile (headless dongle) ----
# 1 = do NOT install the modem stack (modemmanager/qrtr-tools/rmtfs), purge
#     polkit and the legacy wireless firmware blobs (iwlwifi/atheros/brcm/
#     realtek/misc-nonfree, ~215 MiB on a 4 GiB eMMC), and mask the virtual
#     console getty@tty1. WCNSS Wi-Fi, dropbear SSH and USB gadget are
#     unaffected. 0 = keep the 4G-ready userspace as before.
SERVER_PROFILE=1

# ---- eMMC geometry (from the 001b factory backup: 7,569,375 sectors) ----
DISK_TOTAL_SECTORS=7569375

# ---- USB gadget (device mode network) ----
# 0=off, 1=ecm only, 2=rndis+ecm (Windows needs rndis)
USB_GADGET=2
USB_GADGET_IP=192.168.68.1/24

# ---- DietPi / dietpi-installer ----
GITOWNER=MichaIng
GITBRANCH=master
# IMAGE_CREATOR must NOT contain 'diet' (or fourdee|michaing|official|daniel
# knight|dan knight) - DietPi's installer rejects those as reserved names.
IMAGE_CREATOR=UFI001B-Community
PREIMAGE_INFO="UFI001B - MSM8916 4G USB dongle (dietpi-ufi001b)"
DIETPI_PASSWORD=dietpi