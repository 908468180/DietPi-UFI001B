# dietpi-ufi001b board configuration
# Sourced by build.sh and every scripts/*.sh

BOARD=ufi001b
BOARD_NAME="UFI001B"

# ---- device tree ----
# extlinux.conf selects this DTB for lk1st/extlinux.
KERNEL_DTB=msm8916-thwc-ufi001c.dtb

# ---- bootloader (lk1st from msm8916-mainline/lk2nd) ----
# LK1ST_COMPATIBLE must match a compatible listed in the bundled device dts.
# OpenStick-Builder validated yiming,uz801-v3 on this family of devices.
LK1ST_COMPATIBLE=yiming,uz801-v3
LK1ST_BUNDLE_DTB=msm8916-512mb-mtp.dtb

# ---- DTB patch knobs ----
# 0 = keep stock table (up to 998.4 MHz); >0 = 400/800/1000/1100/... up to this MHz.
CPU_OPP_MHZ=1200
# 1 = delete /reserved-memory/mpss + /memshare/mpss@0 (frees ~85 MiB,
#     only when the modem partition / 4G modem is not required).
RELEASE_MEMORY=1

# ---- eMMC geometry (from the 001b factory backup: 7,569,375 sectors) ----
DISK_TOTAL_SECTORS=7569375

# ---- USB gadget (device mode network) ----
# 0=off, 1=ecm only, 2=rndis+ecm (Windows needs rndis)
USB_GADGET=2
USB_GADGET_IP=192.168.68.1/24

# ---- DietPi / dietpi-installer ----
GITOWNER=MichaIng
GITBRANCH=master
IMAGE_CREATOR=dietpi-ufi001b
PREIMAGE_INFO="UFI001B - MSM8916 4G USB dongle (dietpi-ufi001b)"
DIETPI_PASSWORD=dietpi