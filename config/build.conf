# dietpi-ufi001b build configuration
# Sourced by build.sh and every scripts/*.sh

# ---- base Debian used for the DietPi conversion ----
DISTRO_RELEASE=bookworm
DISTRO_TARGET=7                    # DietPi distro index: 7=bookworm
DEBIAN_MIRROR=http://deb.debian.org/debian

# ---- kernel (postmarketOS mainline APK, no compilation needed) ----
PMOS_MIRROR=http://mirror.postmarketos.org/postmarketos/v24.06/aarch64
KERNEL_APK=linux-postmarketos-qcom-msm8916-6.6-r5.apk

# ---- stock Qualcomm firmware (rpm/sbl1/tz) ----
# Same source OpenStick-Builder uses; the sha256 is pinned upstream.
DB410C_FW_URL=https://archive.org/download/dragonboard-410c-bootloader-emmc-linux-176/dragonboard-410c-bootloader-emmc-linux-176.zip
DB410C_FW_SHA256=a37c4e82a970ae2350fcfc7180559caf1dc3928e7c169316fe4ab899b7d305ad
DB410C_FW_ZIP=dragonboard-410c-bootloader-emmc-linux-176